name: release

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-macos:
    if: github.ref_type == 'tag' || github.event.head_commit.message == 'Release macOS port v0.1.0'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pdm-project/setup-pdm@v4
        with:
          cache: true
      - run: pdm install
      - run: pdm run python -m unittest discover -s tests -v
      - run: pdm run pyinstaller
      - name: Package macOS artifacts
        run: |
          cd dist
          COPYFILE_DISABLE=1 zip -qry gf2logger-v0.1.0-macos-arm64.zip gf2logger.app -x '*.DS_Store' -x '__MACOSX/*'
          cd ..
          mkdir -p dist/dmg-root
          cp -R dist/gf2logger.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname gf2logger -srcfolder dist/dmg-root -ov -format UDZO dist/gf2logger-v0.1.0-macos-arm64.dmg
      - uses: softprops/action-gh-release@v2
        with:
          name: gfl2logger for macOS ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/gf2logger-v0.1.0-macos-arm64.zip
            dist/gf2logger-v0.1.0-macos-arm64.dmg
          fail_on_unmatched_files: true
