name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pdm-project/setup-pdm@v4
        with:
          cache: true
      - run: pdm install
      # The tests import the generated protobuf modules, which are not checked in.
      - run: pdm run protoc
      - run: pdm run python -m unittest discover -s tests -v
      - run: pdm run pyinstaller
      - name: Package macOS artifacts
        run: |
          cd dist
          COPYFILE_DISABLE=1 zip -qry "gf2logger-${GITHUB_REF_NAME}-macos-arm64.zip" gf2logger.app -x '*.DS_Store' -x '__MACOSX/*'
          cd ..
          mkdir -p dist/dmg-root
          cp -R dist/gf2logger.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname gf2logger -srcfolder dist/dmg-root -ov -format UDZO "dist/gf2logger-${GITHUB_REF_NAME}-macos-arm64.dmg"
      - uses: softprops/action-gh-release@v2
        with:
          name: gfl2logger for macOS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/gf2logger-${{ github.ref_name }}-macos-arm64.zip
            dist/gf2logger-${{ github.ref_name }}-macos-arm64.dmg
          overwrite_files: false
          fail_on_unmatched_files: true
